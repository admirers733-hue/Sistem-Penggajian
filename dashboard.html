<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Sistem Penggajian</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>SISTEM PENGGAJIAN</h1>

<div class="card">

<h2>Input Data Karyawan</h2>

<input type="hidden" id="indexEdit">

<label>Nama Karyawan</label>

<input type="text" id="nama">

<label>Jabatan</label>

<input type="text" id="jabatan">

<label>Gaji</label>

<input type="number" id="gaji">

<div class="button-group">

<button onclick="tambahData()">
Tambah
</button>

<button onclick="updateData()">
Update
</button>

<button onclick="resetForm()">
Reset
</button>

</div>

</div>

<div class="card">

<h2>Pencarian Data</h2>

<input
type="text"
id="cari"
placeholder="Cari Nama..."
onkeyup="cariData()">

</div>

<div class="card">

<h2>Daftar Penggajian</h2>

<table>

<thead>

<tr>

<th>No</th>

<th>Nama</th>

<th>Jabatan</th>

<th>Gaji</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="tabelData">

</tbody>

</table>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
